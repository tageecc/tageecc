<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="terminal-title">
  <title id="terminal-title">About tagee: full-stack developer building AI agent tooling</title>
  <defs>
    <linearGradient id="border"><stop stop-color="#ff53aa"/><stop offset="1" stop-color="#00e5d0"/></linearGradient>
    <clipPath id="type1"><rect class="typing" style="--start: 1.731602%; --end: 6.926407%; --width: 70px" x="78" y="70" width="70" height="26"/></clipPath>
    <clipPath id="type2"><rect class="typing" style="--start: 12.121212%; --end: 19.047619%; --width: 160px" x="78" y="118" width="160" height="26"/></clipPath>
    <clipPath id="type3"><rect class="typing" style="--start: 32.900433%; --end: 40.692641%; --width: 260px" x="78" y="262" width="260" height="26"/></clipPath>
