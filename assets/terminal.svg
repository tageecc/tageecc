    <style>
      text { font: 16px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #e2d5f3; white-space: pre; }
      .p { fill: #ff53aa; font-weight: 700; }
      .d { fill: #00e5d0; font-weight: 700; }
      .k { fill: #ffcb6b; }
      .s { fill: #a5ff90; }
      .m { fill: #bba6d1; }
      .h { fill: #e5b8ff; font-weight: 700; }
      .title { font-size: 13px; fill: #bba6d1; }
      .line { animation: appear 11.55s linear(0, 0 var(--at, 0%), 1 calc(var(--at, 0%) + 1.298701%), 1) infinite; }
      .typing { animation: type 11.55s linear(0, 0 var(--start), 1 var(--end), 1) infinite; }
      @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
      @keyframes type { from { width: 0; } to { width: var(--width); } }
      @media (prefers-reduced-motion: reduce) { .line, .typing { animation: none; } text { clip-path: none; } }
    </style>
  </defs>
